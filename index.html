<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Interactive Fullscreen Button Animations</title>
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
  }

  body {
    min-height: 100vh;
    background: #090c14;
    color: #ffffff;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 48px 20px;
    overflow-x: hidden;
  }

  body.shake {
    animation: screenShake 0.45s cubic-bezier(0.36, 0.07, 0.19, 0.97) both;
  }

  @keyframes screenShake {
    10%, 90% { transform: translate3d(-3px, 2px, 0); }
    20%, 80% { transform: translate3d(5px, -3px, 0); }
    30%, 50%, 70% { transform: translate3d(-7px, 4px, 0); }
    40%, 60% { transform: translate3d(7px, -2px, 0); }
  }

  h1 {
    font-size: 28px;
    font-weight: 800;
    margin-bottom: 8px;
    background: linear-gradient(90deg, #60a5fa, #a78bfa);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    text-align: center;
  }

  .subtitle {
    color: #94a3b8;
    font-size: 14px;
    margin-bottom: 36px;
    text-align: center;
  }

  /* โครงสร้างจัดเรียงการ์ดปุ่มทั้งหมด */
  .showcase {
    width: 100%;
    max-width: 860px;
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
    gap: 20px;
  }

  .card {
    background: #111623;
    border: 1px solid rgba(255, 255, 255, 0.07);
    border-radius: 16px;
    padding: 36px 24px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 20px;
    transition: border-color 0.3s ease;
  }

  .card:hover {
    border-color: rgba(255, 255, 255, 0.18);
  }

  .label {
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    color: #64748b;
  }

  /* =========================================
     1. CSS - GLOW FILL
     ========================================= */
  .btn1 {
    position: relative;
    padding: 15px 40px;
    border: 1px solid #00e5ff;
    border-radius: 30px;
    background: transparent;
    color: #00e5ff;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    overflow: hidden;
    z-index: 1;
    transition: 0.4s;
  }

  .btn1::before {
    content: "";
    position: absolute;
    top: 50%;
    left: 50%;
    width: 0;
    height: 0;
    background: #00e5ff;
    border-radius: 50%;
    transform: translate(-50%, -50%);
    transition: 0.4s;
    z-index: -1;
  }

  .btn1:hover {
    color: #071014;
    box-shadow: 0 0 20px #00e5ff;
    transform: translateY(-5px);
  }

  .btn1:hover::before {
    width: 350px;
    height: 350px;
  }

  /* =========================================
     2. CSS - LIQUID FILL
     ========================================= */
  .btn2 {
    position: relative;
    padding: 15px 42px;
    border: 2px solid #ff4d8d;
    border-radius: 10px;
    background: transparent;
    color: #ff4d8d;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    overflow: hidden;
    z-index: 1;
    transition: 0.4s;
  }

  .btn2::before {
    content: "";
    position: absolute;
    width: 220px;
    height: 220px;
    left: 50%;
    top: 100%;
    transform: translateX(-50%);
    background: #ff4d8d;
    border-radius: 45%;
    transition: 0.8s;
    z-index: -1;
  }

  .btn2:hover {
    color: #ffffff;
  }

  .btn2:hover::before {
    top: -65%;
    transform: translateX(-50%) rotate(180deg);
  }

  /* =========================================
     3. CSS - ELECTRIC BORDER
     ========================================= */
  .electric {
    position: relative;
    padding: 16px 45px;
    border: 0;
    border-radius: 12px;
    background: #090d18;
    color: #ffffff;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    isolation: isolate;
    overflow: hidden;
    box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.08);
  }

  .electric::before {
    content: "";
    position: absolute;
    width: 220%;
    height: 220%;
    top: -60%;
    left: -60%;
    background: conic-gradient(
      transparent 0deg,
      #00e5ff 45deg,
      #3b82f6 90deg,
      transparent 140deg
    );
    opacity: 0;
    transition: opacity 0.3s ease;
    animation: electric 1.5s linear infinite;
    z-index: -2;
  }

  .electric::after {
    content: "";
    position: absolute;
    inset: 2px;
    border-radius: 10px;
    background: #090d18;
    z-index: -1;
  }

  .electric:hover::before {
    opacity: 1;
  }

  .electric:hover {
    box-shadow: 0 0 20px rgba(0, 229, 255, 0.25);
  }

  @keyframes electric {
    to {
      transform: rotate(360deg);
    }
  }

  /* =========================================
     4. CSS - 3D PRESS
     ========================================= */
  .btn4 {
    padding: 16px 45px;
    border: 0;
    border-radius: 10px;
    background: #5865f2;
    color: #ffffff;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    box-shadow: 0 7px #383a9e;
    transition: 0.15s;
  }

  .btn4:hover {
    transform: translateY(5px);
    box-shadow: 0 2px #383a9e;
  }

  /* =========================================
     5. CSS - MOVING GRADIENT
     ========================================= */
  .btn5 {
    padding: 16px 45px;
    border: 0;
    border-radius: 50px;
    background: linear-gradient(90deg, #ff0080, #7928ca, #00d4ff, #ff0080);
    background-size: 300%;
    color: #ffffff;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    transition: transform 0.3s ease;
  }

  .btn5:hover {
    animation: gradient 1.5s linear infinite;
    transform: scale(1.05);
  }

  @keyframes gradient {
    to {
      background-position: 300%;
    }
  }

  /* =========================================
     FULLSCREEN OVERLAY STAGE
     ========================================= */
  .stage {
    position: fixed;
    inset: 0;
    z-index: 999;
    display: flex;
    justify-content: center;
    align-items: center;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.35s ease;
    overflow: hidden;
  }

  .stage.active {
    opacity: 1;
    pointer-events: auto;
  }

  /* ธีมพื้นหลังแต่ละโหมด */
  .stage.mode-explore {
    background: radial-gradient(circle at center, #041d29 0%, #020810 100%);
  }

  .stage.mode-discover {
    background: #1a0612;
  }

  .stage.mode-launch {
    background: radial-gradient(circle at center, #081838 0%, #03060f 100%);
    box-shadow: inset 0 0 50px rgba(0, 229, 255, 0.55);
  }

  .stage.mode-click {
    background: radial-gradient(circle at center, #1e1b4b 0%, #090a1a 100%);
  }

  .stage.mode-start {
    background: linear-gradient(120deg, #ff0080, #7928ca, #00d4ff, #ff0080);
    background-size: 300% 300%;
    animation: auroraFlow 5s ease infinite;
  }

  @keyframes auroraFlow {
    0% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
  }

  #fxCanvas {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
  }

  /* กล่องข้อความตรงกลางแอนิเมชัน */
  .stage-content {
    position: relative;
    z-index: 10;
    text-align: center;
    padding: 36px 44px;
    border-radius: 24px;
    background: rgba(9, 13, 24, 0.55);
    backdrop-filter: blur(14px);
    border: 1px solid rgba(255, 255, 255, 0.16);
    max-width: 90vw;
    width: 480px;
    transform: scale(0.75) translateY(25px);
    opacity: 0;
    transition: transform 0.55s cubic-bezier(0.16, 1, 0.3, 1) 0.15s,
                opacity 0.45s ease 0.15s;
  }

  .stage.active .stage-content {
    transform: scale(1) translateY(0);
    opacity: 1;
  }

  .stage-badge {
    display: inline-block;
    padding: 6px 14px;
    border-radius: 99px;
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    margin-bottom: 16px;
    background: rgba(255, 255, 255, 0.12);
    color: #ffffff;
  }

  .stage-title {
    font-size: 34px;
    font-weight: 800;
    margin-bottom: 12px;
    letter-spacing: -0.5px;
  }

  .stage-desc {
    color: #e2e8f0;
    font-size: 15px;
    line-height: 1.6;
    margin-bottom: 28px;
  }

  .close-btn {
    padding: 12px 28px;
    border-radius: 99px;
    border: 1px solid rgba(255, 255, 255, 0.3);
    background: rgba(255, 255, 255, 0.12);
    color: #ffffff;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.25s ease;
  }

  .close-btn:hover {
    background: #ffffff;
    color: #090c14;
    transform: scale(1.05);
  }
</style>
</head>
<body>

  <h1>CSS Button Hover & Fullscreen FX</h1>
  <p class="subtitle">ชี้เมาส์เพื่อดูเอฟเฟกต์ปุ่ม และ <b>คลิกที่ปุ่ม</b> เพื่อเปิดแอนิเมชันเต็มจอ</p>

  <div class="showcase">
    <!-- ปุ่มที่ 1 -->
    <div class="card">
      <span class="label">Glow Fill</span>
      <button class="btn1" onclick="triggerFX('explore', event)">Explore More</button>
    </div>

    <!-- ปุ่มที่ 2 -->
    <div class="card">
      <span class="label">Liquid Fill</span>
      <button class="btn2" onclick="triggerFX('discover', event)">Discover</button>
    </div>

    <!-- ปุ่มที่ 3 -->
    <div class="card">
      <span class="label">Electric Border</span>
      <button class="electric" onclick="triggerFX('launch', event)">Launch Now</button>
    </div>

    <!-- ปุ่มที่ 4 -->
    <div class="card">
      <span class="label">3D Press</span>
      <button class="btn4" onclick="triggerFX('click', event)">Click Me</button>
    </div>

    <!-- ปุ่มที่ 5 -->
    <div class="card">
      <span class="label">Moving Gradient</span>
      <button class="btn5" onclick="triggerFX('start', event)">Get Started</button>
    </div>
  </div>

  <!-- หน้าจอแสดงแอนิเมชันเต็มจอ -->
  <div class="stage" id="stage">
    <canvas id="fxCanvas"></canvas>
    <div class="stage-content">
      <div class="stage-badge" id="stageBadge">MODE</div>
      <h2 class="stage-title" id="stageTitle">Title</h2>
      <p class="stage-desc" id="stageDesc">Description</p>
      <button class="close-btn" onclick="closeStage()">✕ กลับไปหน้าหลัก (ESC)</button>
    </div>
  </div>

<script>
  const stage = document.getElementById('stage');
  const canvas = document.getElementById('fxCanvas');
  const ctx = canvas.getContext('2d');
  const stageBadge = document.getElementById('stageBadge');
  const stageTitle = document.getElementById('stageTitle');
  const stageDesc = document.getElementById('stageDesc');

  let animId = null;
  let particles = [];
  let startTime = 0;

  function resizeCanvas() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
  }
  window.addEventListener('resize', resizeCanvas);
  resizeCanvas();

  // ข้อมูลข้อความแต่ละปุ่ม
  const contentMap = {
    explore: {
      badge: 'EXPLORE MORE',
      title: 'สำรวจมิติใหม่ไร้ขีดจำกัด',
      desc: 'พุ่งทะยานผ่านอวกาศดิจิทัลด้วยความเร็วแสง พร้อมค้นพบฟีเจอร์และไอเดียใหม่ๆ ที่ซ่อนอยู่'
    },
    discover: {
      badge: 'DISCOVER',
      title: 'ค้นพบประสบการณ์ที่แตกต่าง',
      desc: 'ปลดล็อกโลกแห่งความสร้างสรรค์ด้วยคลื่นสีสันที่ไหลลื่นและมีชีวิตชีวา'
    },
    launch: {
      badge: 'LAUNCH NOW',
      title: 'ระบบพร้อมทะยานสู่เป้าหมาย!',
      desc: 'ปลดปล่อยพลังงานไฟฟ้าเต็มพิกัด เร่งความเร็วสูงสุดเพื่อเริ่มต้นโปรเจกต์ของคุณทันที'
    },
    click: {
      badge: 'CLICK ME • 3D IMPACT',
      title: 'พลังการกดระดับสูงสุด!',
      desc: 'แรงกระแทก 3 มิติทำงานสมบูรณ์แบบ ตอบสนองทุกการคลิกอย่างทรงพลัง'
    },
    start: {
      badge: 'GET STARTED',
      title: 'ยินดีต้อนรับสู่การเริ่มต้นใหม่',
      desc: 'ทุกอย่างถูกจัดเตรียมไว้พร้อมแล้ว ก้าวเข้าสู่โลกแห่งสีสันและเริ่มสร้างผลงานของคุณได้เลย'
    }
  };

  function triggerFX(mode, event) {
    if (animId) cancelAnimationFrame(animId);
    resizeCanvas();

    // ตั้งค่าข้อความและธีมพื้นหลัง
    stage.className = 'stage active mode-' + mode;
    stageBadge.textContent = contentMap[mode].badge;
    stageTitle.textContent = contentMap[mode].title;
    stageDesc.textContent = contentMap[mode].desc;

    const clickX = event ? event.clientX : canvas.width / 2;
    const clickY = event ? event.clientY : canvas.height / 2;
    startTime = performance.now();
    particles = [];

    // 1. โหมด Explore More: อุโมงค์ดวงดาวความเร็วแสงสีฟ้า
    if (mode === 'explore') {
      for (let i = 0; i < 180; i++) {
        particles.push({
          x: (Math.random() - 0.5) * canvas.width * 2,
          y: (Math.random() - 0.5) * canvas.height * 2,
          z: Math.random() * canvas.width
        });
      }
      let shockRadius = 0;

      function loopExplore() {
        ctx.fillStyle = 'rgba(2, 10, 20, 0.35)';
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        // คลื่นแสงขยายจากจุดคลิก
        if (shockRadius < Math.max(canvas.width, canvas.height) * 1.2) {
          shockRadius += 28;
          ctx.beginPath();
          ctx.arc(clickX, clickY, shockRadius, 0, Math.PI * 2);
          ctx.strokeStyle = `rgba(0, 229, 255, ${Math.max(0, 1 - shockRadius / 1000)})`;
          ctx.lineWidth = 6;
          ctx.stroke();
        }

        const cx = canvas.width / 2;
        const cy = canvas.height / 2;
        particles.forEach(p => {
          p.z -= 18;
          if (p.z <= 1) {
            p.z = canvas.width;
            p.x = (Math.random() - 0.5) * canvas.width * 2;
            p.y = (Math.random() - 0.5) * canvas.height * 2;
          }
          const sx = cx + (p.x / p.z) * 280;
          const sy = cy + (p.y / p.z) * 280;
          const size = Math.max(1, (1 - p.z / canvas.width) * 4.5);

          ctx.beginPath();
          ctx.arc(sx, sy, size, 0, Math.PI * 2);
          ctx.fillStyle = '#00e5ff';
          ctx.shadowBlur = 12;
          ctx.shadowColor = '#00e5ff';
          ctx.fill();
        });
        ctx.shadowBlur = 0;
        animId = requestAnimationFrame(loopExplore);
      }
      loopExplore();
    }

    // 2. โหมด Discover: คลื่นน้ำสีชมพูเอ่อท่วมเต็มจอ + ฟองอากาศ
    else if (mode === 'discover') {
      let waterLevel = canvas.height + 100;
      for (let i = 0; i < 45; i++) {
        particles.push({
          x: Math.random() * canvas.width,
          y: canvas.height + Math.random() * 400,
          r: 3 + Math.random() * 9,
          speed: 2 + Math.random() * 4
        });
      }

      function loopDiscover(now) {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        waterLevel += (-80 - waterLevel) * 0.055; // น้ำค่อยๆ ท่วมขึ้นจนเต็มจอ

        // วาดคลื่น 2 ชั้น
        for (let layer = 0; layer < 2; layer++) {
          ctx.beginPath();
          ctx.moveTo(0, canvas.height);
          for (let x = 0; x <= canvas.width; x += 20) {
            const wave = Math.sin(x * 0.008 + now * 0.004 + layer * 2) * 24;
            ctx.lineTo(x, waterLevel + wave + layer * 18);
          }
          ctx.lineTo(canvas.width, canvas.height);
          ctx.closePath();
          ctx.fillStyle = layer === 0 ? 'rgba(255, 77, 141, 0.55)' : '#ff4d8d';
          ctx.fill();
        }

        // ฟองอากาศลอยขึ้น
        particles.forEach(b => {
          b.y -= b.speed;
          if (b.y < -20) {
            b.y = canvas.height + 20;
            b.x = Math.random() * canvas.width;
          }
          ctx.beginPath();
          ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2);
          ctx.fillStyle = 'rgba(255, 255, 255, 0.28)';
          ctx.fill();
        });

        animId = requestAnimationFrame(loopDiscover);
      }
      loopDiscover(startTime);
    }

    // 3. โหมด Launch Now: สายฟ้าฟาด + จรวดพลังงานพุ่งขึ้นฟ้า
    else if (mode === 'launch') {
      let rocketY = canvas.height + 80;
      for (let i = 0; i < 70; i++) {
        particles.push({
          x: canvas.width / 2 + (Math.random() - 0.5) * 40,
          y: canvas.height,
          vx: (Math.random() - 0.5) * 8,
          vy: 4 + Math.random() * 8,
          life: Math.random()
        });
      }

      function drawLightning(x1, y1, x2, y2) {
        ctx.beginPath();
        ctx.moveTo(x1, y1);
        let curX = x1, curY = y1;
        const steps = 12;
        for (let i = 1; i <= steps; i++) {
          const t = i / steps;
          curX = x1 + (x2 - x1) * t + (i < steps ? (Math.random() - 0.5) * 90 : 0);
          curY = y1 + (y2 - y1) * t;
          ctx.lineTo(curX, curY);
        }
        ctx.strokeStyle = '#00e5ff';
        ctx.lineWidth = 3;
        ctx.shadowBlur = 20;
        ctx.shadowColor = '#3b82f6';
        ctx.stroke();
        ctx.shadowBlur = 0;
      }

      function loopLaunch() {
        ctx.fillStyle = 'rgba(3, 8, 22, 0.32)';
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        // สุ่มสายฟ้าวิ่งเป็นระยะ
        if (Math.random() < 0.22) {
          drawLightning(Math.random() * canvas.width, 0, Math.random() * canvas.width, canvas.height);
        }

        // จรวดพลังงานพุ่งขึ้น
        if (rocketY > -150) rocketY -= 22;
        const rx = canvas.width / 2;

        // ลำแสงไอพ่น
        const grad = ctx.createLinearGradient(rx, rocketY, rx, rocketY + 260);
        grad.addColorStop(0, '#ffffff');
        grad.addColorStop(0.3, '#00e5ff');
        grad.addColorStop(1, 'transparent');
        ctx.fillStyle = grad;
        ctx.fillRect(rx - 8, rocketY, 16, 260);

        // สะเก็ดไฟพุ่งกระจาย
        particles.forEach(p => {
          p.x += p.vx;
          p.y += p.vy;
          p.life -= 0.025;
          if (p.life <= 0) {
            p.x = rx + (Math.random() - 0.5) * 24;
            p.y = Math.min(canvas.height - 20, Math.max(100, rocketY + 40));
            p.life = 1;
          }
          ctx.fillStyle = `rgba(0, 229, 255, ${p.life})`;
          ctx.fillRect(p.x, p.y, 4, 4);
        });

        animId = requestAnimationFrame(loopLaunch);
      }
      loopLaunch();
    }

    // 4. โหมด Click Me: จอสั่น + ระเบิดกล่อง 3D กระจายเต็มจอ
    else if (mode === 'click') {
      document.body.classList.remove('shake');
      void document.body.offsetWidth;
      document.body.classList.add('shake');

      const colors = ['#5865f2', '#818cf8', '#c084fc', '#38bdf8', '#ffffff'];
      for (let i = 0; i < 65; i++) {
        const angle = Math.random() * Math.PI * 2;
        const speed = 6 + Math.random() * 18;
        particles.push({
          x: clickX,
          y: clickY,
          vx: Math.cos(angle) * speed,
          vy: Math.sin(angle) * speed - 4,
          size: 10 + Math.random() * 16,
          rot: Math.random() * Math.PI,
          vRot: (Math.random() - 0.5) * 0.2,
          color: colors[Math.floor(Math.random() * colors.length)]
        });
      }

      function loopClick() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        particles.forEach(p => {
          p.x += p.vx;
          p.y += p.vy;
          p.vy += 0.35; // แรงโน้มถ่วง
          p.vx *= 0.98;
          p.rot += p.vRot;

          // เด้งขอบล่าง
          if (p.y > canvas.height - p.size) {
            p.y = canvas.height - p.size;
            p.vy *= -0.65;
          }

          ctx.save();
          ctx.translate(p.x, p.y);
          ctx.rotate(p.rot);
          ctx.fillStyle = p.color;
          ctx.shadowBlur = 10;
          ctx.shadowColor = 'rgba(88, 101, 242, 0.5)';
          ctx.fillRect(-p.size / 2, -p.size / 2, p.size, p.size);
          ctx.restore();
        });
        animId = requestAnimationFrame(loopClick);
      }
      loopClick();
    }

    // 5. โหมด Get Started: ลูกแก้วแสง Aurora ลอยนุ่มนวลเต็มจอ
    else if (mode === 'start') {
      for (let i = 0; i < 30; i++) {
        particles.push({
          x: Math.random() * canvas.width,
          y: Math.random() * canvas.height,
          r: 20 + Math.random() * 60,
          vx: (Math.random() - 0.5) * 2.5,
          vy: (Math.random() - 0.5) * 2.5
        });
      }

      function loopStart() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        particles.forEach(orb => {
          orb.x += orb.vx;
          orb.y += orb.vy;
          if (orb.x < -60) orb.x = canvas.width + 60;
          if (orb.x > canvas.width + 60) orb.x = -60;
          if (orb.y < -60) orb.y = canvas.height + 60;
          if (orb.y > canvas.height + 60) orb.y = -60;

          const grad = ctx.createRadialGradient(orb.x, orb.y, 0, orb.x, orb.y, orb.r);
          grad.addColorStop(0, 'rgba(255, 255, 255, 0.35)');
          grad.addColorStop(1, 'rgba(255, 255, 255, 0)');
          ctx.fillStyle = grad;
          ctx.beginPath();
          ctx.arc(orb.x, orb.y, orb.r, 0, Math.PI * 2);
          ctx.fill();
        });
        animId = requestAnimationFrame(loopStart);
      }
      loopStart();
    }
  }

  function closeStage() {
    stage.classList.remove('active');
    if (animId) {
      cancelAnimationFrame(animId);
      animId = null;
    }
  }

  // กดปุ่ม ESC เพื่อปิดหน้าแอนิเมชันได้ทันที
  window.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') closeStage();
  });
</script>
