<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Interactive Fullscreen Button Animations</title>
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
  }

  body {
    min-height: 100vh;
    background: #090c14;
    color: #ffffff;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 48px 20px;
    overflow-x: hidden;
  }

  body.shake {
    animation: screenShake 0.45s cubic-bezier(0.36, 0.07, 0.19, 0.97) both;
  }

  @keyframes screenShake {
    10%, 90% { transform: translate3d(-3px, 2px, 0); }
    20%, 80% { transform: translate3d(5px, -3px, 0); }
    30%, 50%, 70% { transform: translate3d(-7px, 4px, 0); }
    40%, 60% { transform: translate3d(7px, -2px, 0); }
  }

  h1 {
    font-size: 28px;
    font-weight: 800;
    margin-bottom: 8px;
    background: linear-gradient(90deg, #60a5fa, #a78bfa);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    text-align: center;
  }

  .subtitle {
    color: #94a3b8;
    font-size: 14px;
    margin-bottom: 36px;
    text-align: center;
  }

  /* โครงสร้างจัดเรียงการ์ดปุ่มทั้งหมด */
  .showcase {
    width: 100%;
    max-width: 860px;
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
    gap: 20px;
  }

  .card {
    background: #111623;
    border: 1px solid rgba(255, 255, 255, 0.07);
    border-radius: 16px;
    padding: 36px 24px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 20px;
    transition: border-color 0.3s ease;
  }

  .card:hover {
    border-color: rgba(255, 255, 255, 0.18);
  }

  .label {
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    color: #64748b;
  }

  /* =========================================
     1. CSS - GLOW FILL
     ========================================= */
  .btn1 {
    position: relative;
    padding: 15px 40px;
    border: 1px solid #00e5ff;
    border-radius: 30px;
    background: transparent;
    color: #00e5ff;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    overflow: hidden;
    z-index: 1;
    transition: 0.4s;
  }

  .btn1::before {
    content: "";
    position: absolute;
    top: 50%;
    left: 50%;
    width: 0;
    height: 0;
    background: #00e5ff;
    border-radius: 50%;
    transform: translate(-50%, -50%);
    transition: 0.4s;
    z-index: -1;
  }

  .btn1:hover {
    color: #071014;
    box-shadow: 0 0 20px #00e5ff;
    transform: translateY(-5px);
  }

  .btn1:hover::before {
    width: 350px;
    height: 350px;
  }

  /* =========================================
     2. CSS - LIQUID FILL
     ========================================= */
  .btn2 {
    position: relative;
    padding: 15px 42px;
    border: 2px solid #ff4d8d;
    border-radius: 10px;
    background: transparent;
    color: #ff4d8d;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    overflow: hidden;
    z-index: 1;
    transition: 0.4s;
  }

  .btn2::before {
    content: "";
    position: absolute;
    width: 220px;
    height: 220px;
    left: 50%;
    top: 100%;
    transform: translateX(-50%);
    background: #ff4d8d;
    border-radius: 45%;
    transition: 0.8s;
    z-index: -1;
  }

  .btn2:hover {
    color: #ffffff;
  }

  .btn2:hover::before {
    top: -65%;
    transform: translateX(-50%) rotate(180deg);
  }

  /* =========================================
     3. CSS - ELECTRIC BORDER
     ========================================= */
  .electric {
    position: relative;
    padding: 16px 45px;
    border: 0;
    border-radius: 12px;
    background: #090d18;
    color: #ffffff;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    isolation: isolate;
    overflow: hidden;
    box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.08);
  }

  .electric::before {
    content: "";
    position: absolute;
    width: 220%;
    height: 220%;
    top: -60%;
    left: -60%;
    background: conic-gradient(
      transparent 0deg,
      #00e5ff 45deg,
      #3b82f6 90deg,
      transparent 140deg
    );
    opacity: 0;
    transition: opacity 0.3s ease;
    animation: electric 1.5s linear infinite;
    z-index: -2;
  }

  .electric::after {
    content: "";
    position: absolute;
    inset: 2px;
    border-radius: 10px;
    background: #090d18;
    z-index: -1;
  }

  .electric:hover::before {
    opacity: 1;
  }

  .electric:hover {
    box-shadow: 0 0 20px rgba(0, 229, 255, 0.25);
  }

  @keyframes electric {
    to {
      transform: rotate(360deg);
    }
  }

  /* =========================================
     4. CSS - 3D PRESS
     ========================================= */
  .btn4 {
    padding: 16px 45px;
    border: 0;
    border-radius: 10px;
    background: #5865f2;
    color: #ffffff;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    box-shadow: 0 7px #383a9e;
    transition: 0.15s;
  }

  .btn4:hover {
    transform: translateY(5px);
    box-shadow: 0 2px #383a9e;
  }

  /* =========================================
     5. CSS - MOVING GRADIENT
     ========================================= */
  .btn5 {
    padding: 16px 45px;
    border: 0;
    border-radius: 50px;
    background: linear-gradient(90deg, #ff0080, #7928ca, #00d4ff, #ff0080);
    background-size: 300%;
    color: #ffffff;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    transition: transform 0.3s ease;
  }

  .btn5:hover {
    animation: gradient 1.5s linear infinite;
    transform: scale(1.05);
  }

  @keyframes gradient {
    to {
      background-position: 300%;
    }
  }

  /* =========================================
     FULLSCREEN OVERLAY STAGE
     ========================================= */
  .stage {
    position: fixed;
    inset: 0;
    z-index: 999;
    display: flex;
    justify-content: center;
    align-items: center;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.35s ease;
    overflow: hidden;
  }

  .stage.active {
    opacity: 1;
    pointer-events: auto;
  }

  /* ธีมพื้นหลังแต่ละโหมด */
  .stage.mode-explore {
    background: radial-gradient(circle at center, #041d29 0%, #020810 100%);
  }

  .stage.mode-discover {
    background: #1a0612;
  }

  .stage.mode-launch {
    background: radial-gradient(circle at center, #081838 0%, #03060f 100%);
    box-shadow: inset 0 0 50px rgba(0, 229, 255, 0.55);
  }

  .stage.mode-click {
    background: radial-gradient(circle at center, #1e1b4b 0%, #090a1a 100%);
  }

  .stage.mode-start {
    background: linear-gradient(120deg, #ff0080, #7928ca, #00d4ff, #ff0080);
    background-size: 300% 300%;
    animation: auroraFlow 5s ease infinite;
  }

  @keyframes auroraFlow {
    0% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
  }

  #fxCanvas {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
  }

  /* กล่องข้อความตรงกลางแอนิเมชัน */
  .stage-content {
    position: relative;
    z-index: 10;
    text-align: center;
    padding: 36px 44px;
    border-radius: 24px;
    background: rgba(9, 13, 24, 0.55);
    backdrop-filter: blur(14px);
    border: 1px solid rgba(255, 255, 255, 0.16);
    max-width: 90vw;
    width: 480px;
    transform: scale(0.75) translateY(25px);
    opacity: 0;
    transition: transform 0.55s cubic-bezier(0.16, 1, 0.3, 1) 0.15s,
                opacity 0.45s ease 0.15s;
  }

  .stage.active .stage-content {
    transform: scale(1) translateY(0);
    opacity: 1;
  }

  .stage-badge {
    display: inline-block;
    padding: 6px 14px;
    border-radius: 99px;
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    margin-bottom: 16px;
    background: rgba(255, 255, 255, 0.12);
    color: #ffffff;
  }

  .stage-title {
    font-size: 34px;
    font-weight: 800;
    margin-bottom: 12px;
    letter-spacing: -0.5px;
  }

  .stage-desc {
    color: #e2e8f0;
    font-size: 15px;
    line-height: 1.6;
    margin-bottom: 28px;
  }

  .close-btn {
    padding: 12px 28px;
    border-radius: 99px;
    border: 1px solid rgba(255, 255, 255, 0.3);
    background: rgba(255, 255, 255, 0.12);
    color: #ffffff;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.25s ease;
  }

  .close-btn:hover {
    background: #ffffff;
    color: #090c14;
    transform: scale(1.05);
  }
</style>
</head>
<body>

  <h1>CSS Button Hover & Fullscreen FX</h1>
  <p class="subtitle">ชี้เมาส์เพื่อดูเอฟเฟกต์ปุ่ม และ
