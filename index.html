<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>CSS Button Hover Animations</title>
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
  }

  body {
    min-height: 100vh;
    background: #090c14;
    color: #ffffff;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 48px 20px;
  }

  h1 {
    font-size: 28px;
    font-weight: 800;
    margin-bottom: 8px;
    background: linear-gradient(90deg, #60a5fa, #a78bfa);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    text-align: center;
  }

  .subtitle {
    color: #94a3b8;
    font-size: 14px;
    margin-bottom: 36px;
    text-align: center;
  }

  /* โครงสร้างจัดเรียงการ์ดปุ่มทั้งหมด */
  .showcase {
    width: 100%;
    max-width: 860px;
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
    gap: 20px;
  }

  .card {
    background: #111623;
    border: 1px solid rgba(255, 255, 255, 0.07);
    border-radius: 16px;
    padding: 36px 24px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 20px;
    transition: border-color 0.3s ease;
  }

  .card:hover {
    border-color: rgba(255, 255, 255, 0.16);
  }

  .label {
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    color: #64748b;
  }

  /* =========================================
     1. CSS - GLOW FILL
     ========================================= */
  .btn1 {
    position: relative;
    padding: 15px 40px;
    border: 1px solid #00e5ff;
    border-radius: 30px;
    background: transparent;
    color: #00e5ff;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    overflow: hidden;
    z-index: 1;
    transition: 0.4s;
  }

  .btn1::before {
    content: "";
    position: absolute;
    top: 50%;
    left: 50%;
    width: 0;
    height: 0;
    background: #00e5ff;
    border-radius: 50%;
    transform: translate(-50%, -50%);
    transition: 0.4s;
    z-index: -1;
  }

  .btn1:hover {
    color: #071014;
    box-shadow: 0 0 20px #00e5ff;
    transform: translateY(-5px);
  }

  .btn1:hover::before {
    width: 350px;
    height: 350px;
  }

  /* =========================================
     2. CSS - LIQUID FILL
     ========================================= */
  .btn2 {
    position: relative;
    padding: 15px 42px;
    border: 2px solid #ff4d8d;
    border-radius: 10px;
    background: transparent;
    color: #ff4d8d;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    overflow: hidden;
    z-index: 1;
    transition: 0.4s;
  }

  .btn2::before {
    content: "";
    position: absolute;
    width: 220px;
    height: 220px;
    left: 50%;
    top: 100%;
    transform: translateX(-50%);
    background: #ff4d8d;
    border-radius: 45%;
    transition: 0.8s;
    z-index: -1;
  }

  .btn2:hover {
    color: #ffffff;
  }

  .btn2:hover::before {
    top: -65%;
    transform: translateX(-50%) rotate(180deg);
  }

  /* =========================================
     3. CSS - ELECTRIC BORDER
     ========================================= */
  .electric {
    position: relative;
    padding: 16px 45px;
    border: 0;
    border-radius: 12px;
    background: #090d18;
    color: #ffffff;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    isolation: isolate;
    overflow: hidden;
    box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.08);
  }

  .electric::before {
    content: "";
    position: absolute;
    width: 220%;
    height: 220%;
    top: -60%;
    left: -60%;
    background: conic-gradient(
      transparent 0deg,
      #00e5ff 45deg,
      #3b82f6 90deg,
      transparent 140deg
    );
    opacity: 0;
    transition: opacity 0.3s ease;
    animation: electric 1.5s linear infinite;
    z-index: -2;
  }

  .electric::after {
    content: "";
    position: absolute;
    inset: 2px;
    border-radius: 10px;
    background: #090d18;
    z-index: -1;
  }

  .electric:hover::before {
    opacity: 1;
  }

  .electric:hover {
    box-shadow: 0 0 20px rgba(0, 229, 255, 0.25);
  }

  @keyframes electric {
    to {
      transform: rotate(360deg);
    }
  }

  /* =========================================
     4. CSS - 3D PRESS
     ========================================= */
  .btn4 {
    padding: 16px 45px;
    border: 0;
    border-radius: 10px;
    background: #5865f2;
    color: #ffffff;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    box-shadow: 0 7px #383a9e;
    transition: 0.15s;
  }

  .btn4:hover {
    transform: translateY(5px);
    box-shadow: 0 2px #383a9e;
  }

  /* =========================================
     5. CSS - MOVING GRADIENT
     ========================================= */
  .btn5 {
    padding: 16px 45px;
    border: 0;
    border-radius: 50px;
    background: linear-gradient(90deg, #ff0080, #7928ca, #00d4ff, #ff0080);
    background-size: 300%;
    color: #ffffff;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    transition: transform 0.3s ease;
  }

  .btn5:hover {
    animation: gradient 1.5s linear infinite;
    transform: scale(1.05);
  }

  @keyframes gradient {
    to {
      background-position: 300%;
    }
  }
</style>
</head>
<body>

  <h1>CSS Button Hover Animation</h1>
  <p class="subtitle">เลื่อนเมาส์ไปชี้ที่ปุ่มแต่ละแบบเพื่อดูแอนิเมชัน</p>

  <div class="showcase">
    <!-- ปุ่มที่ 1 -->
    <div class="card">
      <span class="label">Glow Fill</span>
      <button class="btn1">Explore More</button>
    </div>

    <!-- ปุ่มที่ 2 -->
    <div class="card">
      <span class="label">Liquid Fill</span>
      <button class="btn2">Discover</button>
    </div>

    <!-- ปุ่มที่ 3 -->
    <div class="card">
      <span class="label">Electric Border</span>
      <button class="electric">Launch Now</button>
    </div>

    <!-- ปุ่มที่ 4 -->
    <div class="card">
      <span class="label">3D Press</span>
      <button class="btn4">Click Me</button>
    </div>

    <!-- ปุ่มที่ 5 -->
    <div class="card">
      <span class="label">Moving Gradient</span>
      <button class="btn5">Get Started</button>
    </div>
  </div>

</body>
</html>
