<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<title>OTP Verification Animation</title>
<style>
  body {
    background: #0d0e12; color: #fff; font-family: system-ui, sans-serif;
    display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0;
  }
  .card {
    background: #161821; padding: 32px; border-radius: 24px; text-align: center; width: 320px;
  }
  .otp-wrapper {
    position: relative; margin: 24px auto; width: 276px; height: 180px;
    display: flex; justify-content: center; align-items: center;
  }
  #otp {
    position: absolute; inset: 0; opacity: 0; z-index: 10; cursor: pointer;
  }
  /* เพิ่ม width: fit-content และ margin: 0 auto เพื่อให้หดตรงกลางพอดีเมื่อ gap เป็น 0 */
  .shunt-grid {
    display: grid; grid-template-columns: repeat(3, 84px); grid-template-rows: repeat(2, 84px);
    gap: 12px; position: relative; width: fit-content; margin: 0 auto;
    transition: gap 0.35s cubic-bezier(0.2, 0.8, 0.2, 1);
  }
  .focus-ring {
    position: absolute; width: 84px; height: 84px; border-radius: 16px;
    border: 2px solid #8b7eff; box-shadow: 0 0 16px rgba(139, 126, 255, 0.5);
    pointer-events: none; transition: transform 0.2s cubic-bezier(0.2, 0.8, 0.2, 1), opacity 0.2s;
    z-index: 5; box-sizing: border-box;
  }
  .shunt-tile {
    perspective: 800px; border-radius: 16px; overflow: hidden;
    transition: border-radius 0.35s ease;
  }
  .shunt-flip {
    width: 100%; height: 100%; position: relative;
    transform-style: preserve-3d; transition: transform 0.5s cubic-bezier(0.4, 0, 0.2, 1);
  }
  .front, .back {
    position: absolute; inset: 0; backface-visibility: hidden;
    display: flex; align-items: center; justify-content: center;
  }
  .front { background: #222533; font-size: 28px; font-weight: 600; }
  .back { background: #14332a; transform: rotateY(180deg); overflow: hidden; }
  /* ปรับขนาด SVG เป็น 252x168 (ขนาดตอนช่องชิดกันพอดี) เพื่อไม่ให้ภาพแหว่ง */
  .back svg {
    position: absolute; width: 252px; height: 168px; max-width: none;
  }
  .shunt-grid[data-flipped] .shunt-flip { transform: rotateY(180deg); }
  .shunt-grid[data-flipped] .focus-ring { opacity: 0; }
  .shunt-grid[data-merged] {
    gap: 0; border-radius: 16px; overflow: hidden;
    box-shadow: 0 0 24px rgba(52, 211, 153, 0.15);
  }
  .shunt-grid[data-merged] .shunt-tile { border-radius: 0; }
</style>
</head>
<body>

<div class="card">
  <h3 id="title">Check your phone</h3>
  <p id="sub" style="color:#8e93a4;font-size:14px;">ลองพิมพ์รหัส <b>270364</b></p>

  <div class="otp-wrapper">
    <input id="otp" type="text" inputmode="numeric" maxlength="6" autocomplete="one-time-code" autofocus>
    <div class="shunt-grid" id="grid">
      <div class="focus-ring" id="ring"></div>
    </div>
  </div>
</div>

<script>
  const CORRECT_CODE = "270364";
  const grid = document.getElementById("grid");
  const input = document.getElementById("otp");
  const ring = document.getElementById("ring");
  const tiles = [];

  // สร้างช่อง 3x2 โดยอ้างอิงระยะ 84px ต่อช่องให้ภาพต่อกันสนิทเมื่อยุบรวม
  for (let i = 0; i < 6; i++) {
    const col = i % 3, row = Math.floor(i / 3);
    const tile = document.createElement("div");
    tile.className = "shunt-tile";
    tile.innerHTML = `
      <div class="shunt-flip" style="transition-delay: ${i * 40}ms">
        <div class="front"></div>
        <div class="back">
          <svg viewBox="0 0 252 168" style="left: ${-col * 84}px; top: ${-row * 84}px;">
            <circle cx="126" cy="84" r="52" fill="none" stroke="#34d399" stroke-width="10"/>
            <path d="M104 85 L119 100 L150 69" fill="none" stroke="#34d399" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </div>
      </div>`;
    grid.appendChild(tile);
    tiles.push(tile);
  }

  function updateUI() {
    const val = input.value.replace(/\D/g, "").slice(0, 6);
    input.value = val;
    tiles.forEach((t, idx) => t.querySelector(".front").textContent = val[idx] || "");

    const activeIdx = Math.min(val.length, 5);
    const x = (activeIdx % 3) * (84 + 12);
    const y = Math.floor(activeIdx / 3) * (84 + 12);
    ring.style.transform = `translate(${x}px, ${y}px)`;

    if (val.length === 6) {
      if (val === CORRECT_CODE) verifySuccess();
      else document.getElementById("sub").innerHTML = `<span style="color:#f87171">รหัสไม่ถูกต้อง ลอง 270364</span>`;
    }
  }

  function swapDOM(i, j) {
    const parent = grid;
    const nodeA = parent.querySelectorAll(".shunt-tile")[i];
    const nodeB = parent.querySelectorAll(".shunt-tile")[j];
    const siblingA = nodeA.nextSibling === nodeB ? nodeA : nodeA.nextSibling;
    nodeB.parentNode.insertBefore(nodeA, nodeB);
    parent.insertBefore(nodeB, siblingA);
  }

  function animateSwap(i, j, tempo) {
    const currentTiles = grid.querySelectorAll(".shunt-tile");
    const a = currentTiles[i], b = currentTiles[j];
    const firstA = a.getBoundingClientRect(), firstB = b.getBoundingClientRect();
    swapDOM(i, j);
    const lastA = a.getBoundingClientRect(), lastB = b.getBoundingClientRect();

    [ [a, firstA, lastA], [b, firstB, lastB] ].forEach(([el, first, last]) => {
      el.style.transition = "none";
      el.style.transform = `translate(${first.left - last.left}px, ${first.top - last.top}px)`;
      requestAnimationFrame(() => {
        el.style.transition = `transform ${tempo}ms cubic-bezier(0.2, 0.8, 0.2, 1)`;
        el.style.transform = "translate(0, 0)";
      });
    });
  }

  function verifySuccess() {
    input.disabled = true;
    const trail = [0, 1, 4, 3, 0, 1, 2, 5];
    for (let i = 0; i < trail.length - 1; i++) swapDOM(trail[i], trail[i + 1]);

    grid.setAttribute("data-flipped", "");

    const tempo = 160;
    let delay = 600;
    for (let i = trail.length - 2; i >= 0; i--) {
      setTimeout(() => animateSwap(trail[i], trail[i + 1], tempo), delay);
      delay += tempo + 30;
    }

    setTimeout(() => {
      grid.setAttribute("data-merged", "");
      document.getElementById("title").textContent = "You're verified";
      document.getElementById("sub").textContent = "Your number is confirmed on this device.";
    }, delay + 100);
  }

  input.addEventListener("input", updateUI);
  updateUI();
</script>
</body>
</html>
